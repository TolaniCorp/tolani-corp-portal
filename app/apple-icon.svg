<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Tolani Corp Apple Touch Icon -->
  
  <!-- Dark background -->
  <rect width="180" height="180" rx="40" fill="#0a0a0f"/>
  
  <!-- Penrose Triangle -->
  <g fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="miter" transform="translate(90, 85) scale(0.95)">
    <polygon points="0,-65 -60,55 60,55" fill="#0a0a0f"/>
    <line x1="0" y1="-65" x2="-60" y2="55"/>
    <line x1="-12" y1="-40" x2="-45" y2="25"/>
    <line x1="0" y1="-65" x2="-12" y2="-40"/>
    <line x1="-60" y1="55" x2="-30" y2="55"/>
    <line x1="-30" y1="55" x2="-30" y2="25"/>
    <line x1="-30" y1="25" x2="-45" y2="25"/>
    <line x1="0" y1="-65" x2="60" y2="55"/>
    <line x1="12" y1="-40" x2="45" y2="25"/>
    <line x1="0" y1="-65" x2="12" y2="-40"/>
    <line x1="60" y1="55" x2="30" y2="55"/>
    <line x1="30" y1="55" x2="30" y2="25"/>
    <line x1="30" y1="25" x2="45" y2="25"/>
    <line x1="-30" y1="25" x2="30" y2="25"/>
    <line x1="-30" y1="55" x2="30" y2="55"/>
    <polygon points="0,-10 -18,30 18,30" fill="#0a0a0f"/>
    <line x1="-12" y1="-40" x2="-10" y2="-10"/>
    <line x1="-10" y1="-10" x2="-10" y2="25"/>
    <line x1="12" y1="-40" x2="10" y2="-10"/>
    <line x1="10" y1="-10" x2="10" y2="25"/>
    <line x1="0" y1="-10" x2="-12" y2="-40"/>
    <line x1="0" y1="-10" x2="12" y2="-40"/>
  </g>
  
  <!-- Red accent triangle -->
  <polygon fill="#E74C3C" points="138,125 155,155 121,155"/>
  
</svg>
