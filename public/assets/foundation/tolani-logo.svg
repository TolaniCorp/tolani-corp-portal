<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
  <!-- Tolani Corp - Penrose Impossible Triangle Logo -->
  <!-- Classic optical illusion with red accent point -->
  
  <g fill="none" stroke="#1a1a2e" stroke-width="1" stroke-linejoin="miter">
    
    <!-- === OUTER TRIANGLE === -->
    <!-- Filled white background -->
    <polygon points="100,15 25,145 175,145" fill="#fff"/>
    
    <!-- === LEFT ARM === -->
    <line x1="100" y1="15" x2="25" y2="145"/>
    <line x1="88" y1="40" x2="45" y2="115"/>
    <line x1="100" y1="15" x2="88" y2="40"/>
    <line x1="25" y1="145" x2="55" y2="145"/>
    <line x1="55" y1="145" x2="55" y2="115"/>
    <line x1="55" y1="115" x2="45" y2="115"/>
    
    <!-- === RIGHT ARM === -->
    <line x1="100" y1="15" x2="175" y2="145"/>
    <line x1="112" y1="40" x2="155" y2="115"/>
    <line x1="100" y1="15" x2="112" y2="40"/>
    <line x1="175" y1="145" x2="145" y2="145"/>
    <line x1="145" y1="145" x2="145" y2="115"/>
    <line x1="145" y1="115" x2="155" y2="115"/>
    
    <!-- === BOTTOM BAR === -->
    <line x1="55" y1="115" x2="145" y2="115"/>
    <line x1="55" y1="145" x2="145" y2="145"/>
    
    <!-- === INNER TRIANGLE === -->
    <polygon points="100,55 72,105 128,105" fill="#fff"/>
    
    <!-- === IMPOSSIBLE CONNECTIONS === -->
    <line x1="88" y1="40" x2="72" y2="70"/>
    <line x1="72" y1="70" x2="72" y2="105"/>
    <line x1="72" y1="105" x2="72" y2="115"/>
    <line x1="112" y1="40" x2="128" y2="70"/>
    <line x1="128" y1="70" x2="128" y2="105"/>
    <line x1="128" y1="105" x2="128" y2="115"/>
    <line x1="100" y1="55" x2="88" y2="40"/>
    <line x1="100" y1="55" x2="112" y2="40"/>
    <line x1="72" y1="115" x2="55" y2="115"/>
    <line x1="128" y1="115" x2="145" y2="115"/>
    
  </g>
  
  <!-- RED ACCENT TRIANGLE -->
  <polygon fill="#E74C3C" points="162,130 182,165 142,165"/>
  
</svg>
