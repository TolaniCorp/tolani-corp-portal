<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Penrose impossible triangle - white monochrome version -->
  <!-- For dark backgrounds where you need pure white -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- Left vertical segment -->
    <path d="M 60 150 L 60 80 L 100 35"/>
    
    <!-- Right side going down -->
    <path d="M 100 35 L 140 80 L 140 150"/>
    
    <!-- Bottom horizontal -->
    <path d="M 140 150 L 60 150"/>
    
    <!-- Inner impossible connections creating the illusion -->
    <path d="M 60 120 L 100 75 L 100 150"/>
    <path d="M 140 120 L 100 75"/>
    
    <!-- Accent point at top vertex -->
    <circle cx="100" cy="35" r="10" fill="#ffffff" stroke="none"/>
  </g>
</svg>
