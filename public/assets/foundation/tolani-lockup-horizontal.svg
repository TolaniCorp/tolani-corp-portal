<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Tolani Corp horizontal lockup - logo + wordmark -->
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#4a4a6a"/>
    </linearGradient>
  </defs>
  
  <!-- Penrose Logo (scaled to fit) -->
  <g transform="translate(10, 25) scale(0.75)">
    <g fill="none" stroke="#1a1a2e" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 60 150 L 60 80 L 100 35"/>
      <path d="M 100 35 L 140 80 L 140 150"/>
      <path d="M 140 150 L 60 150"/>
      <path d="M 60 120 L 100 75 L 100 150"/>
      <path d="M 140 120 L 100 75"/>
      <circle cx="100" cy="35" r="10" fill="#E74C3C" stroke="none"/>
    </g>
  </g>
  
  <!-- Wordmark -->
  <text x="170" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="700" fill="url(#textGradient)">
    Tolani Corp
  </text>
</svg>
