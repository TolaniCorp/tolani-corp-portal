<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Space+Grotesk:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; overflow: hidden; }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background-color: #000000;
        background-image: radial-gradient(circle at 50% 50%, rgba(0, 180, 216, 0.1) 0%, transparent 60%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Inter', sans-serif;
        color: #E5E5E5;
        border: 2px solid #000000;
        box-sizing: border-box;
      }
      .closing-group {
        text-align: center;
      }
      .main-title {
        font-family: 'Montserrat', sans-serif;
        font-size: 72px;
        color: #FFB800;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 20px;
      }
      .subtitle {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 32px;
        color: #2ECC71;
        margin-bottom: 60px;
        opacity: 0.9;
      }
      .contact-info {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 20px;
        color: #A0A0B0;
        letter-spacing: 2px;
      }
      .contact-info span {
        color: #FFB800;
      }
      .footer-decor {
        position: absolute;
        bottom: 40px;
        font-size: 12px;
        color: #000000;
        text-transform: uppercase;
        letter-spacing: 5px;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="closing-group">
            <h1 class="main-title">Welcome to the Fleet</h1>
            <p class="subtitle">Let's build the future of software together.</p>
            <p class="contact-info">Questions? <span>terri@tolanicorp.com</span></p>
        </div>
        <div class="footer-decor">
            TOLANI LABS // DEVBOT // MISSION COMMAND
        </div>
    </div>
</body>
</html>
