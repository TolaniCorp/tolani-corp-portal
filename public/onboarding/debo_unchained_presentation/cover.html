<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      .slide-container { 
        width: 1280px; 
        min-height: 720px; 
        box-sizing: border-box; 
        background: #000000; 
        color: #FFFFFF; 
        font-family: 'Space Grotesk', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
      }
      .logo-container {
        width: 250px;
        height: 220px; /* reduced from 250 */
        margin-bottom: 20px; /* reduced from 40 */
      }
      .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .branding-title {
        font-size: 80px;
        font-family: 'JetBrains Mono', monospace;
        color: #FFB800;
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }
      .cursor {
        width: 30px;
        height: 60px;
        background-color: #00FF41; /* Classic Terminal Green */
        margin: 0 10px;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        from, to { opacity: 1; }
        50% { opacity: 0; }
      }
      .subtitle {
        font-size: 28px;
        color: #FFFFFF;
        opacity: 0.7;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-top: 10px; /* tighten spacing */
      }
      .decor-line {
        position: absolute;
        width: 100%;
        height: 1px;
        background: rgba(212, 175, 55, 0.2);
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="decor-line" style="top: 10%;"></div>
        <div class="decor-line" style="bottom: 10%;"></div>
        <div class="logo-container">
            <img src="/home/ubuntu/presentation_assets/master_brand/TolaniLabs_DigitalT.png" alt="DEBO Unchained Logo">
        </div>
        <div class="branding-title">
            DE<div class="cursor"></div>BO UNCHAINED
        </div>
        <p class="subtitle">Precision Offensive Security Platform</p>
    </div>
</body>
</html>
