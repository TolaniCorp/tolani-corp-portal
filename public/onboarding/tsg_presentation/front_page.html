<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #000000;
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('/home/ubuntu/presentation_assets/tsg_bg.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            border: 10px solid #D4AF37;
        }
        .header-content {
            text-align: center;
            z-index: 2;
        }
        .ankh-symbol {
            font-size: 80px;
            color: #D4AF37;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(229, 198, 75, 0.4);
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 64px;
            color: #D4AF37;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 28px;
            color: #D4AF37;
            letter-spacing: 2px;
            font-weight: 300;
        }
        .bottom-accent {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, #000000, #D4AF37, #000000);
        }
        .logo-box {
            position: absolute;
            top: 40px;
            right: 60px;
        }
        .logo-box img {
            height: 60px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="logo-box">
            <img src="/home/ubuntu/presentation_assets/master_brand/TolaniCorp_GoldenT.png" alt="TUT Logo">
        </div>
        <div class="header-content">
            <div class="ankh-symbol">☥</div>
            <h1>Tolani Supply Group</h1>
            <p class="subtitle">Logistics & Supply Chain Excellence</p>
        </div>
        <div class="bottom-accent"></div>
    </div>
</body>
</html>
