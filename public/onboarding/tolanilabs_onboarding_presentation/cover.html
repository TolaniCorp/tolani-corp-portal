<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Space+Grotesk:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; overflow: hidden; }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        box-sizing: border-box;
        background-color: #000000;
        background-image: 
          linear-gradient(rgba(225, 6, 0, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(225, 6, 0, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Inter', sans-serif;
        color: #E5E5E5;
        position: relative;
        border: 10px solid #FFB800;
      }
      .title-group {
        text-align: center;
        background: rgba(43, 43, 43, 0.9);
        padding-top: 40px;
        padding-left: 60px;
        padding-right: 60px;
        border: 2px solid #FFB800;
      }
      .main-title {
        font-family: 'Montserrat', sans-serif;
        font-size: 96px;
        color: #FFB800;
        text-transform: uppercase;
        letter-spacing: 8px;
        margin-bottom: 10px;
      }
      .subtitle {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 36px;
        color: #FFB800;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 30px;
      }
      .motto {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 20px;
        color: #E5E5E5;
        letter-spacing: 10px;
        text-transform: uppercase;
        opacity: 0.8;
      }
      .footer-decor {
        position: absolute;
        bottom: 30px;
        width: 100%;
        text-align: center;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 14px;
        color: #FFB800;
        letter-spacing: 2px;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="title-group">
            <h1 class="main-title">Tolani Labs</h1>
            <p class="subtitle">The Factory Onboarding</p>
            <p class="motto">Action // Alert // Speed</p>
        </div>
        <div class="footer-decor">
            FACTORY OF THE FUTURE // OPERATIONAL READINESS // 2026
        </div>
    </div>
</body>
</html>
