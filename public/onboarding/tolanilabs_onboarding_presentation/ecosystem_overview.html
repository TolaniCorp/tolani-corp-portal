<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Space+Grotesk:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background-color: #000000;
        background-image: linear-gradient(rgba(225, 6, 0, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(225, 6, 0, 0.02) 1px, transparent 1px);
        background-size: 50px 50px;
        display: flex;
        flex-direction: column;
        font-family: 'Inter', sans-serif;
        color: #E5E5E5;
      }
      .header {
        padding-top: 60px;
        padding-left: 60px;
      }
      .page-title {
        font-family: 'Montserrat', sans-serif;
        font-size: 32px;
        color: #FFB800;
        text-transform: uppercase;
        border-left: 6px solid #FFB800;
        padding-left: 20px;
      }
      .image-container {
        /* reduced top padding to pull image up */
        padding-top: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .image-container img {
        width: 1100px;
        /* reduced image height to fit under 720px total */
        height: 480px;
        object-fit: cover;
        border: 2px solid #FFB800;
      }
      .portfolio-footer {
        padding-top: 10px;
        display: flex;
        justify-content: space-evenly;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 18px;
        color: #FFB800;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h1 class="page-title">The Tolani Ecosystem</h1>
        </div>
        <div class="image-container">
            <img src="/home/ubuntu/tolanilabs_onboarding_presentation/assets/tolani_factory.png" alt="Tolani Factory Illustration">
        </div>
        <div class="portfolio-footer">
            <span>BettorsACE</span>
            <span>Listo</span>
            <span>Hook Travel</span>
            <span>DevBot</span>
        </div>
    </div>
</body>
</html>
