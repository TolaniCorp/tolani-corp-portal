<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Space+Grotesk:wght@400&family=Inter:wght@400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      /* remove default body margin to avoid extra 8px gap that caused overflow */
      body { margin: 0; }
      .slide-container {
        width: 1280px;
        min-height: 720px; /* keep as required */
        background-color: #000000;
        background-image: 
          linear-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(212, 175, 55, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        font-family: 'Inter', sans-serif;
        color: #FFFFFF;
      }
      .logo-container {
        position: absolute;
        top: 60px;
        left: 60px;
      }
      .logo {
        height: 60px;
        object-fit: contain;
      }
      .content-wrapper {
        text-align: center;
        max-width: 900px;
        z-index: 2;
      }
      .title {
        font-family: 'Montserrat', sans-serif;
        font-size: 64px;
        color: #FFB800;
        margin-bottom: 12px; /* reduced spacing below title to save height */
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .subtitle {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 32px;
        color: #FFFFFF;
        line-height: 1.3; /* slightly tighter to reduce vertical space */
        font-weight: 400;
      }
      .decorative-accent {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 260px; /* slightly smaller so it doesn't visually push layout */
        height: 260px;
        background: linear-gradient(135deg, transparent 50%, #FFB800 50%);
        opacity: 0.1;
      }
      .footer-info {
        position: absolute;
        bottom: 48px; /* moved up slightly to relieve bottom pressure */
        font-family: 'Space Grotesk', sans-serif;
        font-size: 16px;
        color: #A0A0B0;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="logo-container">
            <img src="/home/ubuntu/presentation_assets/master_brand/TolaniLabs_DigitalT.png" class="logo" alt="BettorsACE Logo">
        </div>
        <div class="content-wrapper">
            <h1 class="title">BettorsACE Early Employee Onboarding</h1>
            <p class="subtitle">Operating the Platform with Confidence:<br>Mechanics, Paygates, Policies, and Security Ops</p>
        </div>
        <div class="decorative-accent"></div>
        <div class="footer-info">
            v1.0 | April 2026 | Tolani Labs
        </div>
    </div>
</body>
</html>
