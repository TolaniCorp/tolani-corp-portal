<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Space+Grotesk:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      body { margin: 0; }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background-color: #000000;
        background-image: 
          linear-gradient(rgba(255, 184, 0, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 184, 0, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        display: flex;
        flex-direction: column;
        font-family: 'Inter', sans-serif;
        color: #FFFFFF;
        position: relative;
      }
      .header {
        padding-top: 60px;
        padding-left: 60px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .logo {
        height: 40px;
        object-fit: contain;
      }
      .page-title {
        font-family: 'Montserrat', sans-serif;
        font-size: 32px;
        color: #FFB800;
        text-transform: uppercase;
      }
      .flow-image {
        padding-top: 40px;
        padding-left: 60px;
        padding-right: 60px;
        text-align: center;
      }
      .flow-image img {
        width: 1000px;
        height: 250px;
        object-fit: contain;
        border: 1px solid #252540;
      }
      .priority-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        padding-top: 40px;
        padding-left: 60px;
        padding-right: 60px;
      }
      .priority-box {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid #252540;
        padding-top: 20px;
        padding-left: 20px;
        padding-right: 20px;
        min-height: 120px;
      }
      .priority-box.p0 { border-color: #FF4444; }
      .priority-box h3 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 18px;
        margin-bottom: 10px;
      }
      .p0 h3 { color: #FF4444; }
      .p1 h3 { color: #FFB800; }
      .priority-box p {
        font-size: 14px;
        color: #A0A0B0;
        line-height: 1.4;
      }
      .strategy-note {
        margin-top: 20px;
        text-align: center;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 20px;
        color: #FFB800;
        font-weight: 700;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <img src="/home/ubuntu/presentation_assets/master_brand/TolaniLabs_DigitalT.png" class="logo" alt="Logo">
            <h1 class="page-title">Incident Response Basics</h1>
        </div>
        <div class="flow-image">
            <img src="/home/ubuntu/bettorsace_onboarding_presentation/assets/incident_response_flow.png" alt="Incident Response Flow">
        </div>
        <div class="priority-grid">
            <div class="priority-box p0">
                <h3>P0: Critical / Unsafe</h3>
                <p>Core flow unavailable or security breach. Requires immediate all-hands triage and mitigation.</p>
            </div>
            <div class="priority-box p1">
                <h3>P1: Major Degradation</h3>
                <p>Significant impairment with workarounds. Requires urgent fix within the current shift.</p>
            </div>
        </div>
        <div class="strategy-note">
            MITIGATE FIRST, DEEP DIAGNOSIS SECOND.
        </div>
    </div>
</body>
</html>
