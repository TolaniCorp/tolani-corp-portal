<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #000000;
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('/home/ubuntu/presentation_assets/corp_bg.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            border: 10px solid #D4AF37;
        }
        .circuit-accent {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, rgba(0, 175, 175, 0.1), transparent);
            border: 1px solid rgba(0, 175, 175, 0.3);
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 72px;
            color: #D4AF37;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.6);
        }
        .subtitle {
            font-size: 32px;
            color: #D4AF37;
            text-align: center;
            max-width: 900px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .ankh-symbol {
            font-size: 80px;
            color: #D4AF37;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(229, 198, 75, 0.4);
        }
        .est-tag {
            position: absolute;
            bottom: 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #D4AF37;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="circuit-accent"></div>
        <div class="ankh-symbol">☥</div>
        <h1>Tolani Corp</h1>
        <p class="subtitle">Architecting the Future of Global Workforce Ecosystems</p>
        <div class="est-tag">Excellence Through Innovation</div>
    </div>
</body>
</html>
