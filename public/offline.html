<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tolani Corp Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020617;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 680px;
        padding: 40px 24px;
      }

      img {
        width: 220px;
        height: auto;
      }

      h1 {
        margin: 32px 0 16px;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1;
      }

      p {
        color: #cbd5e1;
        font-size: 1rem;
        line-height: 1.8;
      }

      a {
        color: #f0d18f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/brand/logo.svg" alt="Tolani Corp" />
      <h1>Offline console shell</h1>
      <p>
        The Tolani Corp service worker has cached the core operating shell. Reconnect to refresh live routes,
        portfolio data, and communications status.
      </p>
      <p><a href="/">Return to cached homepage</a></p>
    </main>
  </body>
</html>
